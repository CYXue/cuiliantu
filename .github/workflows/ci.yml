name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Do not pin the version here: `.node-version` is the single source
          # of truth. A previous hard-coded `20` drifted from the local 22 and
          # jsdom 30 (requiring Node 22+ APIs) failed only in CI.
          node-version-file: '.node-version'

      - name: Install pnpm
        # Do not pin the version here: `packageManager` in package.json is the
        # single source of truth (corepack reads the same value locally).
        # A previous hard-coded `9` drifted from the local 12 and CI could not
        # parse the pnpm 11+ pnpm-workspace.yaml (allowBuilds) format.
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          echo "::group::pnpm install"
          pnpm install
          echo "::endgroup::"

      # Vulnerability gate. `--ignore-registry-errors` is the important part:
      # it exits 0 when the advisory registry itself is unreachable while still
      # exiting non-zero for real findings. A blanket `continue-on-error: true`
      # could not tell those apart, so a reachable-but-compromised dependency
      # set passed just as quietly as an outage — the audit was decorative.
      - name: Audit npm dependencies
        run: |
          echo "::group::pnpm audit"
          pnpm audit --audit-level=high --ignore-registry-errors
          echo "::endgroup::"

      - name: Check Biome (format + lint)
        run: |
          echo "::group::biome check"
          pnpm lint
          echo "::endgroup::"

      - name: Check Rust formatting
        run: |
          echo "::group:: cargo fmt"
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          echo "::endgroup::"

      - name: Check TypeScript
        run: |
          echo "::group::Check TypeScript"
          pnpm run build
          echo "::endgroup::"

      - name: Test frontend
        # Coverage collection also enforces the thresholds configured in
        # vite.config.ts (lines/stmts/funcs 70, branches 60): a drop below
        # them fails this step, making the coverage gate hard.
        run: |
          echo "::group::vitest + coverage"
          pnpm test:coverage
          echo "::endgroup::"

      # cargo resolves its config relative to the current directory, so `cd`
      # into src-tauri instead of using --manifest-path (same as bin/agent-check).
      - name: Check Rust (clippy)
        working-directory: ./src-tauri
        run: |
          echo "::group::cargo clippy"
          cargo clippy --all-targets -- -D warnings
          echo "::endgroup::"

      - name: Test Rust
        working-directory: ./src-tauri
        run: |
          echo "::group::cargo test"
          cargo test
          echo "::endgroup::"

      - name: Build Tauri app (debug, no bundle)
        run: |
          echo "::group::Build Tauri app (debug)"
          pnpm tauri build --debug --no-bundle
          echo "::endgroup::"
